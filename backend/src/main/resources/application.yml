spring:
  application:
    name: aegis-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${SPRING_DATASOURCE_USERNAME:aegis}
    password: ${SPRING_DATASOURCE_PASSWORD:aegis_secret}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:120000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:300000}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${PORT:8080}
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

aegis:
  cors:
    allowed-origins: ${AEGIS_CORS_ALLOWED_ORIGINS:*}
  security:
    interactive-max-per-minute: ${AEGIS_INTERACTIVE_MAX_PER_MINUTE:30}
  competitors:
    mutations-enabled: ${AEGIS_COMPETITORS_MUTATIONS_ENABLED:true}
  demo:
    trial-enabled: ${AEGIS_DEMO_TRIAL_ENABLED:true}
    trial-minutes: ${AEGIS_DEMO_TRIAL_MINUTES:5}
    ask-agent-grace-uses: ${AEGIS_DEMO_ASK_AGENT_GRACE_USES:5}
  harvest:
    competitors: ${AEGIS_TRACKED_COMPETITORS:Microsoft,Google,Amazon,OpenAI,Anthropic}

  rag:
    enabled: ${AEGIS_RAG_ENABLED:false}
    backfill-on-startup: ${AEGIS_RAG_BACKFILL_ON_STARTUP:false}
    top-k: 5
    chunk-size: 1200
    chunk-overlap: 150
    max-chunks-per-article: 20

  sources:
    rss:
      cron: "0 */30 * * * *"   # every 30 minutes
      feeds: >
        https://techcrunch.com/feed/,
        https://feeds.arstechnica.com/arstechnica/index,
        https://www.theverge.com/rss/index.xml,
        https://aws.amazon.com/blogs/aws/feed/,
        https://blogs.microsoft.com/feed/,
        https://openai.com/news/rss.xml,
        https://www.anthropic.com/rss.xml,
        https://blog.google/technology/ai/rss/,
        https://feeds.feedburner.com/venturebeat/SZYF

    gdelt:
      cron: "0 */15 * * * *"   # every 15 minutes (GDELT updates every 15 min)

    reddit:
      cron: "0 */30 * * * *"   # every 30 minutes

    hackernews:
      cron: "0 */20 * * * *"   # every 20 minutes

    edgar:
      cron: "0 0 */4 * * *"    # every 4 hours (SEC filings are infrequent)

    github:
      cron: "0 0 * * * *"      # every hour
      org-map: "{'Microsoft':'microsoft','Google':'google','Amazon':'aws','OpenAI':'openai','Anthropic':'anthropic'}"

    googlenews:
      cron: "0 0 * * * *"      # every hour (override via AEGIS_SOURCES_GOOGLENEWS_CRON)

    financial:
      cron: "0 0 * * * *"      # every hour — Yahoo Finance stock/financial data

    contracts:
      cron: "0 0 */4 * * *"    # every 4 hours — USASpending.gov government contracts

    industry:
      cron: "0 0 6 * * *"      # daily at 06:00 UTC — World Bank + FRED macro data

logging:
  level:
    com.aegis: INFO
    org.springframework.ai: WARN
