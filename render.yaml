# Render Blueprint — https://render.com/docs/blueprint-spec
# Database: Neon Postgres (external). No Render-managed database (avoids free-tier DB limit).
# Deploy: Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: aegis-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Paste from Neon dashboard (use pooled connection string for Render)
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AEGIS_TRACKED_COMPETITORS
        value: Microsoft,Google,Amazon,OpenAI,Anthropic
      - key: AEGIS_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com

  - type: web
    name: aegis-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
