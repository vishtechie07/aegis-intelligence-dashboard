# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo

databases:
  - name: aegis-db
    databaseName: aegis
    user: aegis
    plan: free

services:
  - type: web
    name: aegis-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      # Set in Render Dashboard (sync: false) — team default OpenAI key
      - key: OPENAI_API_KEY
        sync: false
      - key: AEGIS_TRACKED_COMPETITORS
        value: Microsoft,Google,Amazon,OpenAI,Anthropic
      - key: AEGIS_CORS_ALLOWED_ORIGINS
        fromService:
          name: aegis-dashboard
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: aegis-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
